name: Build debug APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o WhitelistChecker_v11.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make gradlew executable
        working-directory: WhitelistChecker
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: WhitelistChecker
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: whitelist-checker-debug
          path: WhitelistChecker/app/build/outputs/apk/debug/app-debug.apk
          
