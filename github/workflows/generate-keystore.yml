name: Generate release keystore

on:
  workflow_dispatch:
    inputs:
      store_password:
        description: 'Пароль для keystore (придумай сам, сохрани где-то)'
        required: true
      key_password:
        description: 'Пароль для самого ключа (можно тот же, что и store_password)'
        required: true
      key_alias:
        description: 'Alias ключа'
        required: true
        default: 'wlchek'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias "${{ github.event.inputs.key_alias }}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ github.event.inputs.store_password }}" \
            -keypass "${{ github.event.inputs.key_password }}" \
            -dname "CN=Konstantin, OU=Dev, O=WLchek, L=Smolensk, S=Smolensk, C=RU"
          base64 -w 0 release.keystore > release.keystore.base64

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: release.keystore.base64
