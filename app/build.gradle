plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.konstantin.whitelistchecker'
    compileSdk 36
    buildToolsVersion "36.0.0"

    defaultConfig {
        applicationId "com.konstantin.whitelistchecker"
        minSdk 26
        targetSdk 36
        versionCode 5
        versionName "3.0"
    }

    // Подпись релиза берётся из переменных окружения (задаются в CI из
    // GitHub Secrets). Если их нет — releaseSigningConfig остаётся null,
    // и релизная сборка просто не подписывается релизным ключом
    def keystorePath = System.getenv("RELEASE_KEYSTORE_PATH")
    def hasReleaseSigning = keystorePath != null && new File(keystorePath).exists()

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(keystorePath)
                storePassword System.getenv("RELEASE_STORE_PASSWORD")
                keyAlias System.getenv("RELEASE_KEY_ALIAS")
                keyPassword System.getenv("RELEASE_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
    implementation 'androidx.activity:activity-ktx:1.9.3'

    // Ядро OpenFlux (gomobile), собрано из mobile/ пакета исходников OpenFlux.
    implementation files('libs/openflux.aar')

    // Сканирование QR (как в официальном клиенте OpenFlux).
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.zxing:core:3.5.3'
}
